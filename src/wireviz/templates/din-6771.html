    table, td, th, #frame {

    table {

      border-bottom: 0;
      border-right: 0;
      border-spacing: 0mm;

    td, th {
      border-top: 0;
      border-left: 0;

      /* display: inline-block; */
      white-space: nowrap;
      font-size: 2.8mm;
    }

    /* Canvas size based on DIN 823 / DIN 6771 / EN ISO 5457 */

    /* The frame is a column: the diagram takes the space left above the
       footer (BOM + title block), so the diagram never overlaps them. */
    #frame {
      position: relative;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .A4, .sheetsize_default { /* portrait */
      width: 180mm;
      height: 277mm;
    }

    .A3 { /* landscape */
      width: 390mm;
      height: 277mm;
    }

    .A2 { /* landscape */
      width: 564mm;
      height: 400mm;
    }

    #diagram {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      text-align: center;
    }

    #drawing {
      flex: 1 1 auto;
      min-height: 0;
      padding: 3mm;
    }

    #drawing svg, #drawing img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* A4: BOM on top of the title block; A3 and larger: BOM to its left */
    #footer {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .A3 #footer, .A2 #footer {
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-end;
    }

    #titleblock table {
      width: 180mm;
      height: 38.25mm;
    }

    #titleblock tr, #bom tr {
      height: 4.25mm;
    }

    #bom table {
      width:180mm;
    }

    #bom th, td {

    }

    #bom .bom_col_id {
      text-align: center;
    }

    #bom .bom_col_qty {
      text-align: right;
    }

    .name {

    .date {

    .revno {

      width: 6mm;
